<title id="MathJax-SVG-1-Title">\begin{bmatrix}
a&amp;b\\
c&amp;d\\
e&amp;f\\
\end{bmatrix}
*
\begin{bmatrix}
x_1&amp;x_2\\
y_1&amp;y_2\\
\end{bmatrix}
=
\begin{bmatrix}
a*x_1 + b*y_1&amp;a*x_2+b*y_2\\
c*x_1 + d*y_1&amp;c*x_2+d*y_2\\
e*x_1 + f*y_1&amp;e*x_2+f*y_2\\
\end{bmatrix}</title>
